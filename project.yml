name: Elsfm
options:
  bundleIdPrefix: com.elsfm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsuki/KeychainAccess
    from: "4.2.2"

targets:
  Elsfm:
    type: application
    platform: iOS
    sources:
      - path: Elsfm
    resources:
      - path: Elsfm/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elsfm.mobile
        INFOPLIST_FILE: Elsfm/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Kingfisher
      - package: GoogleSignIn
      - package: KeychainAccess
    info:
      path: Elsfm/Resources/Info.plist
      properties:
        CFBundleDisplayName: Elsfm
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Needed for voice features"
        NSPhotoLibraryUsageDescription: "Choose a profile picture"
        CFBundleURLTypes:
          - CFBundleURLName: com.elsfm.mobile
            CFBundleURLSchemes:
              - elsfm

  ElsfmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ElsfmTests
    dependencies:
      - target: Elsfm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elsfm.mobile.tests
